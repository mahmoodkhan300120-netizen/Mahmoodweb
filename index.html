<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajput UC Store</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
    
    <style>
        :root {
            --gold: #ffcc00;
            --bg: #0a0b0c;
            --card: rgba(255, 255, 255, 0.1);
            --green: #2ecc71;
            --red: #e74c3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0b0c;
            background: radial-gradient(circle at center, #1a1c20 0%, #0a0b0c 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container { width: 100%; max-width: 450px; }

        header { text-align: center; margin-bottom: 20px; margin-top: 10px; }
        .brand { font-family: 'Orbitron', sans-serif; color: var(--gold); font-size: 1.8rem; text-transform: uppercase; }

        /* Loader Overlay */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none;
            flex-direction: column; justify-content: center; align-items: center; z-index: 9999;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid var(--card);
            border-top-color: var(--gold); border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Card */
        .glass-card {
            background: var(--card);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        /* View Management */
        .view { display: none; }
        .active { display: block; }

        .input-group { margin-bottom: 15px; }
        label { display: block; color: var(--gold); font-size: 0.75rem; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        input, select {
            width: 100%; padding: 14px; background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
            color: white; font-size: 1rem; outline: none;
        }

        .btn {
            width: 100%; padding: 16px; border-radius: 10px; border: none;
            font-family: 'Orbitron', sans-serif; font-weight: bold; cursor: pointer;
            text-transform: uppercase; margin-top: 10px; font-size: 0.9rem;
            transition: 0.2s;
        }
        .btn-main { background: linear-gradient(to right, #ffcc00, #ff9900); color: black; }
        .btn-a { background: var(--green); color: white; }
        .btn-b { background: var(--red); color: white; }
        .btn:active { transform: scale(0.95); }

        .info-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 3px solid var(--gold); }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.9rem; }

        .icon-big { font-size: 4rem; margin-bottom: 15px; display: block; text-align: center; }
        .fail-msg {
            background: rgba(231, 76, 60, 0.1); border: 1px dashed var(--red);
            padding: 20px; border-radius: 10px; margin: 15px 0;
            color: #ffcccc; text-align: center; font-size: 1rem; line-height: 1.4;
        }

        footer { text-align: center; padding: 25px; font-size: 0.7rem; opacity: 0.4; }
    </style>
</head>
<body>

    <!-- Loader -->
    <div id="loader">
        <div class="spinner"></div>
    </div>

    <div class="container">
        <header><h1 class="brand">Rajput UC Store</h1></header>

        <div class="glass-card">
            
            <!-- 1. HOME SCREEN -->
            <div id="screen1" class="view active">
                <div class="input-group">
                    <label>Player Name</label>
                    <input type="text" id="playerName" placeholder="Account Name">
                </div>
                <div class="input-group">
                    <label>Player ID</label>
                    <input type="number" id="playerId" placeholder="PUBG ID">
                </div>
                <div class="input-group">
                    <label>UC</label>
                    <select id="ucAmount">
                        <option>60 UC</option><option>325 UC</option>
                        <option>660 UC</option><option>1800 UC</option>
                        <option>3850 UC</option><option>8100 UC</option>
                    </select>
                </div>
                <!-- This button is calling the function directly -->
                <button class="btn btn-main" onclick="onSendUCClick()">Send UC <i class="fa-solid fa-paper-plane"></i></button>
            </div>

            <!-- 2. ADMIN CHOICE SCREEN -->
            <div id="screen2" class="view">
                <h3 style="text-align:center; margin-bottom:15px; font-family:'Orbitron'; color:var(--gold);">Verification</h3>
                <div class="info-box">
                    <div class="info-row"><span>Name:</span> <span id="outName" style="color:var(--gold)"></span></div>
                    <div class="info-row"><span>ID:</span> <span id="outId"></span></div>
                    <div class="info-row"><span>UC:</span> <span id="outPkg"></span></div>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <button class="btn btn-a" onclick="onOptionAClick()">Option A</button>
                    <button class="btn btn-b" onclick="onOptionBClick()">Option B</button>
                </div>
            </div>

            <!-- 3. SUCCESS VIEW -->
            <div id="screen3" class="view" style="text-align:center;">
                <i class="fa-solid fa-circle-check icon-big" style="color:var(--green)"></i>
                <h2 style="color:var(--green); font-family:'Orbitron';">Sent!</h2>
                <p style="margin-top:15px;">The UC has been successfully delivered to <strong><span id="finalName" style="color:var(--gold)"></span></strong>.</p>
                <button class="btn btn-main" onclick="onResetApp()" style="margin-top:25px;">Start New</button>
            </div>

            <!-- 4. FAILURE VIEW -->
            <div id="screen4" class="view" style="text-align:center;">
                <i class="fa-solid fa-circle-xmark icon-big" style="color:var(--red)"></i>
                <h2 style="color:var(--red); font-family:'Orbitron';">Error</h2>
                <div class="fail-msg">
                    This UC amount cannot be added to your account. You must send a larger amount.....
                </div>
                <button class="btn btn-main" onclick="onResetApp()">Try Again</button>
            </div>

        </div>

        <footer>&copy; 2026 Rajput UC Store</footer>
    </div>

    <script>
        // Simple function to hide all views and show only one
        function showScreen(screenId) {
            // Show loader
            document.getElementById('loader').style.display = 'flex';
            
            setTimeout(() => {
                // Hide loader
                document.getElementById('loader').style.display = 'none';
                
                // Hide all views
                const views = document.getElementsByClassName('view');
                for (let i = 0; i < views.length; i++) {
                    views[i].style.display = 'none';
                }
                
                // Show the specific one
                document.getElementById(screenId).style.display = 'block';
            }, 700);
        }

        // Click Logic for SEND UC
        function onSendUCClick() {
            const name = document.getElementById('playerName').value;
            const id = document.getElementById('playerId').value;
            const pkg = document.getElementById('ucAmount').value;

            if (name === "" || id === "") {
                alert("Please fill Name and ID!");
                return;
            }

            // Fill data for verification screen
            document.getElementById('outName').innerText = name;
            document.getElementById('outId').innerText = id;
            document.getElementById('outPkg').innerText = pkg;

            showScreen('screen2');
        }

        // Click Logic for Option A
        function onOptionAClick() {
            const name = document.getElementById('playerName').value;
            document.getElementById('finalName').innerText = name;
            showScreen('screen3');
        }

        // Click Logic for Option B
        function onOptionBClick() {
            showScreen('screen4');
        }

        // Reset everything to Home
        function onResetApp() {
            document.getElementById('playerName').value = "";
            document.getElementById('playerId').value = "";
            showScreen('screen1');
        }
    </script>
</body>
</html>
